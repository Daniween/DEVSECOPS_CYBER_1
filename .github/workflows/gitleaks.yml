name: Gitleaks Secret Scan

on:
  push:
  pull_request:

jobs:
  gitleaks-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Manually
        run: |
          # On installe gitleaks manuellement pour avoir le contrôle total
          VERSION=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | jq -r .tag_name)
          wget https://github.com/gitleaks/gitleaks/releases/download/${VERSION}/gitleaks_${VERSION#v}_linux_x64.tar.gz
          tar -xzf gitleaks_${VERSION#v}_linux_x64.tar.gz
          
          # On lance le scan exactement comme sur ton PC
          ./gitleaks detect --source . --verbose --no-git